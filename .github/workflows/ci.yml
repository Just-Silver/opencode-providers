name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# 同一分支上过时的运行直接取消（省 runner 分钟）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 单测 + 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node >= 23.6 默认启用 TS 类型擦除，测试直接用 .ts（与本地一致）
          node-version: 24
      - name: 版本一致性（package.json == CHANGELOG 顶部）
        run: node scripts/changelog.mjs check
      - name: 单测（含随仓分文件注册表的聚合校验）
        run: node --test
      - name: 注册表源一致性（分文件 → 聚合 + index/revision）
        run: node .opencode/skills/opencode-providers-registry/scripts/registry.mjs validate
      - name: 注册表体检（悬空 base 引用 / 孤儿共享模型 / 重复 baseURL / input 缺 text…）
        run: node .opencode/skills/opencode-providers-registry/scripts/registry.mjs check --strict
