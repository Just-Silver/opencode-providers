name: Release

# 发版策略：**预发布优先** —— 默认只发测试版到 npm 的 `next`，正式版必须手动确认才发 `latest`。
#
#   预发布（version 形如 0.1.0-beta.0）：push tag `v0.1.0-beta.0` → 发到 npm 的 `next`
#   正式版  （version 形如 0.1.0）      ：push tag `v1.2.3` → 发到 npm 的 `latest`
#                                        （也可用 Actions → Release → Run workflow 勾 publish [+ stable]）
#
# 前置：npm 包必须已存在（首次发布人工 `npm publish` 一次），并已登记 Trusted Publisher（OIDC，无需长期 token）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '真的发布到 npm（不勾只做打包预检）'
        type: boolean
        default: false
      stable:
        description: '允许把正式版发到 latest（默认只发预发布到 next）'
        type: boolean
        default: false

# 发布不可并行：排队串行，不取消
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 建/更新 GitHub Release
  id-token: write   # npm Trusted Publishing（OIDC）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 单测
        run: node --test

      - name: 版本一致性（tag == package.json == CHANGELOG）
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            node scripts/changelog.mjs check --tag "$TAG"
          else
            node scripts/changelog.mjs check
          fi

      - name: 从 CHANGELOG 提取 Release 正文
        run: node scripts/changelog.mjs notes --out release-notes.md

      - name: 发布到 npm（预发布 → next；正式版需手动确认 → latest）
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_STABLE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          publish=true
          if [ "$EVENT" != "push" ]; then
            publish="${INPUT_PUBLISH:-false}"
          fi

          if [ "$publish" != "true" ]; then
            # 预检：只打包，不发布。
            # 别用 `npm publish --dry-run`——它仍会向 registry 做「重复版本」校验，已发布时会直接报
            # `You cannot publish over the previously published versions`。
            echo "::notice::预检模式：只跑 npm pack --dry-run（不发布、不访问 registry）"
            npm pack --dry-run
            exit 0
          fi

          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac

          # push tag 本身就是明确的发布意图 → 正式 tag 直接发 latest。
          # 只有 workflow_dispatch 的入口才需要显式勾 stable 才允许发 latest（不勾 = 预检打包）。
          stable="${INPUT_STABLE:-false}"
          if [ "$EVENT" = "push" ]; then stable=true; fi

          if [ "$tag" = "latest" ] && [ "$stable" != "true" ]; then
            echo "::error::${name}@${version} 是正式版：手动运行时请勾选 publish + stable（publish 才发布，stable 才允许发到 latest）"
            exit 1
          fi

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} 已存在于 registry → 跳过发布（版本号不可复用，请 bump）"
            exit 0
          fi

          echo "→ npm publish --tag $tag（$name@$version）"
          npm publish --tag "$tag"

      # 手动发布（含正式版）先补 tag：tag 由 GITHUB_TOKEN 推送，不会反过来触发本工作流。
      - name: 建 tag（仅手动 publish）
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::tag $tag 已存在，跳过"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "✓ 已建并推送 tag $tag"

      - name: 建/更新 GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          # 版本含 `-`（如 0.3.2-beta.0）= 预发布 → GitHub Release 标 prerelease。
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac
          echo "→ Release $tag（prerelease=${prerelease:-false}）"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md $prerelease
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md $prerelease
          fi
